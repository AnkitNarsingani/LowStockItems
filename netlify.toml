[build]
  # Migrations run before the bundle is built, so the schema can never be
  # behind the functions that depend on it. They are tracked in
  # schema_migrations and applied once, so repeat builds are no-ops.
  #
  # It runs here rather than from a developer's machine because DATABASE_URL is
  # marked secret, and Netlify deliberately withholds secret values from
  # `netlify dev` — the build is the only place the real value exists. A failed
  # migration fails the build, which is what we want: no deploy against a
  # schema that did not apply.
  command = "node database/migrations/run.mjs && npm run build"
  publish = "build"
  functions = "netlify/functions"

# The API must be matched before the SPA catch-all below, or every /api/*
# request would be answered with index.html. Netlify evaluates redirects in
# file order, so this pass-through has to come first.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

# Makes BrowserRouter work on refresh and direct links (/po/new, /settings).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
